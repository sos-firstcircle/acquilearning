<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library | Acquisition Learning Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2a10 10 0 0 1 10 10h-7a3 3 0 0 0-3-3z' fill='%23F0605D'/><path d='M22 12a10 10 0 0 1-10 10v-7a3 3 0 0 0 3-3z' fill='%232BB3A8'/><path d='M12 22A10 10 0 0 1 2 12h7a3 3 0 0 0 3 3z' fill='%23F5B83D'/><path d='M2 12A10 10 0 0 1 12 2v7a3 3 0 0 0-3 3z' fill='%238FD3E0'/></svg>">
<link rel="stylesheet" href="shared/theme.css">
<script src="shared/lms.js"></script>
<script src="shared/shell.js"></script>
<script src="existing/library.js"></script>
<style>
  .lead{margin:6px 0 18px;color:var(--ink-2);font-size:15px;max-width:640px}
  .bar{margin-bottom:14px}
  .bar input{width:100%;max-width:380px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px}
  .bar input:focus{outline:2px solid var(--teal);border-color:var(--teal)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 36px;align-items:start}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .sec{margin:0 0 16px}
  .sec h2{font-size:15px;margin:0 0 6px;color:var(--deep)}
  .sec ul{list-style:none;margin:0;padding:0}
  .sec li{margin:0}
  .it{display:flex;align-items:center;gap:8px;padding:5px 0;color:#000;font-size:14px;text-decoration:underline}
  .it:hover{color:var(--teal-dark)}
  .it svg{flex:none;color:#000}
  .none{display:none;color:var(--ink-3)}
</style>
</head>
<body>
<div id="strip"></div>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="wrap" id="app"></div></main>
</div>
<script>
const LINK_ICO = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
if (LMS.requireSignIn()) {
  if (!LMS.isExisting() && !LMS.isAdmin()) { location.replace("dashboard.html"); }
  else {
    renderSide("library");
    document.getElementById("app").innerHTML = `<h1>Library</h1>
      <p class="lead" style="margin-bottom:12px">Reading links in one place.</p>
      <div class="bar"><input id="q" type="search" placeholder="Search the library" autocomplete="off"></div>
      <div class="cols">${LIBRARY_GROUPS.map(g => `<div class="sec"><h2>${esc(g.title)}</h2><ul>${g.items.map(i => `<li><a class="it" href="${esc(i.href)}" target="_blank" rel="noopener" data-q="${esc((i.label+" "+g.title).toLowerCase())}">${LINK_ICO}<span>${esc(i.label)}</span></a></li>`).join("")}</ul></div>`).join("")}</div>
      <p class="none" id="none">Nothing found. Try a different word.</p>`;
    document.getElementById("q").addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase(); let n = 0;
      document.querySelectorAll(".it").forEach(a => { const li = a.parentNode; const ok = !q || a.dataset.q.includes(q); li.style.display = ok ? "" : "none"; if (ok) n++; });
      document.querySelectorAll(".sec").forEach(s => s.style.display = s.querySelector("li:not([style*='none'])") ? "" : "none");
      document.getElementById("none").style.display = n ? "none" : "block";
    });
  }
}
</script>
</body>
</html>
