<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions | Acquisition Learning Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2a10 10 0 0 1 10 10h-7a3 3 0 0 0-3-3z' fill='%23F0605D'/><path d='M22 12a10 10 0 0 1-10 10v-7a3 3 0 0 0 3-3z' fill='%232BB3A8'/><path d='M12 22A10 10 0 0 1 2 12h7a3 3 0 0 0 3 3z' fill='%23F5B83D'/><path d='M2 12A10 10 0 0 1 12 2v7a3 3 0 0 0-3 3z' fill='%238FD3E0'/></svg>">
<link rel="stylesheet" href="shared/theme.css">
<script src="shared/lms.js"></script>
<script src="modules.js"></script>
<script src="shared/shell.js"></script>
<script src="shared/attendance.js"></script>
<script src="shared/pager.js"></script>
<style>
  .lead{margin:8px 0 22px;color:var(--ink-2);font-size:15px;max-width:680px}
  .sc{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;margin-bottom:16px}
  .sc h3{font-size:16px;line-height:1.3}
  .sc .meta{font-size:13px;color:var(--ink-2);margin:2px 0 10px}
  .counts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pill{display:inline-block;font-weight:600;padding:2px 10px;border-radius:20px;font-size:13px}
  .pill.yes{background:var(--green-soft);color:var(--green)} .pill.no{background:var(--coral-soft);color:var(--coral)} .pill.none{background:var(--mist);color:var(--ink-3)}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg)}
  h2.sec{font-size:16px;margin:28px 0 12px}
  .bar{margin:0 0 18px}
</style>
</head>
<body>
<div id="strip"></div>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="wrap" id="app"></div></main>
</div>
<script>
const $ = id => document.getElementById(id);
const nameOf = e => e.split("@")[0].split(/[._-]/).map(w => w ? w[0].toUpperCase()+w.slice(1) : "").join(" ");
const when = iso => iso ? new Date(iso).toLocaleString("en-PH",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
const fmt = s => { const d = new Date(s.when), end = new Date(d.getTime()+(s.minutes||60)*60000), t = x => x.toLocaleTimeString("en-PH",{hour:"numeric",minute:"2-digit"});
  return `${d.toLocaleDateString("en-PH",{weekday:"long",month:"long",day:"numeric"})} · ${t(d)} to ${t(end)}`; };

let noReplies = false, batchSel = "", cal = [], calErr = false, PPL = [], BL = [], LOGINS = null;   // PPL: People tab (Settings), for onboardees of new batches
const TEST_BATCHES = ["000000", "000001"];   // test accounts: left out of "All batches"; pick the batch to see them
async function load(){
  $("app").innerHTML = '<h1>Sessions</h1><p class="muted">Loading replies from the Sheet…</p>';
  const [res, cr, pp, lg] = await Promise.all([LMS.adminRsvps(), LMS.syncCalSessions().then(r => r !== null, () => false), LMS.adminPeople ? LMS.adminPeople().catch(() => null) : null, LMS.adminTracking ? LMS.adminTracking(false).catch(() => null) : null]);
  LOGINS = lg && lg.ok ? lg.logins || [] : null;
  PPL = (pp && pp.ok && pp.people) || []; BL = ((pp && pp.ok && pp.batches) || []).map(b => String(b.batch || "")).filter(Boolean); if (window.Attendance) Attendance.reload();
  cal = LMS.calSessions(); calErr = !cr;
  if (res && res.error === "not-admin") { $("app").innerHTML = '<h1>Sessions</h1><p class="muted">Your email isn\'t an admin.</p>'; return; }
  noReplies = !res || !res.ok;   // still show the sessions; replies come once the Sheet answers (or Code.gs is redeployed)
  render((res && res.rsvps) || []);
}

function render(rows){
  // latest reply per person + session wins
  const latest = {};
  rows.slice().sort((a,b) => String(a.Timestamp).localeCompare(String(b.Timestamp))).forEach(r => { latest[String(r.Email).toLowerCase() + "|" + r["Session ID"]] = r; });
  const R = LMS.roster(), now = new Date();
  const bl = s => s.batch ? [].concat(s.batch) : [];
  const allBatches = [...new Set((window.LMS_SESSIONS || []).flatMap(bl).concat(cal.flatMap(s => s.batches || []), PPL.filter(p => p.active && p.batch).map(p => String(p.batch)), BL))].filter(b => b && b !== "000002").sort();   // plus batches from Settings, so a new batch can add sessions by hand
  // Google Calendar events (salesops calendar, Code.gs calSessions) plus modules.js sessions; a modules.js one at the same start time as a calendar one is left out
  const calList = cal.filter(s => batchSel ? (s.batches || []).includes(batchSel) : (s.batches || []).some(b => !TEST_BATCHES.includes(b)) || !(s.batches || []).length).map(s => ({ ...s, cal:true }));
  const legacy = (window.LMS_SESSIONS || []).filter(s => !batchSel || !s.batch || bl(s).includes(batchSel)).filter(s => !cal.some(c => +new Date(c.when) === +new Date(s.when)));
  const sessions = legacy.concat(calList).map(s => ({ ...s, d:new Date(s.when) })).sort((a,b) => a.d - b.d);
  const LBL = { yes:"Yes", no:"No", maybe:"Maybe" };
  const calCard = s => {
    const admins = R.admins.map(a => a.toLowerCase());
    const list = (s.guests || []).filter(g => !admins.includes(g.email)).sort((x, y) => ({ no:0, maybe:1, "":2, yes:3 }[x.status] - { no:0, maybe:1, "":2, yes:3 }[y.status]) || x.email.localeCompare(y.email));
    const n = a => list.filter(x => x.status === a).length;
    return `<div class="sc"><h3>${esc(s.title)} <span class="pill none" style="font-size:11px;vertical-align:middle">Google Calendar</span></h3>
      <div class="meta">${esc(fmt(s))} · Room: ${s.room ? esc(s.room) : "None"} · Meeting link: ${s.link ? `<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.link.replace(/^https?:\/\//, ""))}</a>` : "None"}${(s.batches || []).length ? ` · Batch ${esc(s.batches.join(", "))}` : ""}${Object.keys(s.days || {}).filter(b => s.days[b]).map(b => ` · Day ${s.days[b]} for ${esc(b)}`).join("")}${s.desc ? `<br><span style="white-space:pre-line">${esc(s.desc)}</span>` : ""}</div>
      <div class="counts"><span class="pill yes">Yes ${n("yes")}</span><span class="pill no">No ${n("no")}</span><span class="pill none">Maybe ${n("maybe")}</span><span class="pill none">No reply ${n("")}</span></div>
      <div class="scroll"><table class="tbl"><thead><tr><th>Guest</th><th>Reply in Calendar</th></tr></thead><tbody>
      ${list.map(g => `<tr><td><b>${esc(nameOf(g.email))}</b><div class="small muted">${esc(g.email)}</div></td><td>${g.status ? `<span class="pill ${g.status === "maybe" ? "none" : g.status}">${LBL[g.status]}</span>` : '<span class="pill none">No reply yet</span>'}</td></tr>`).join("") || '<tr><td colspan="2" class="muted">No guests invited.</td></tr>'}
      </tbody></table></div></div>`;
  };
  const card = s => {
    if (s.cal) return calCard(s);
    const expected = (s.batch ? bl(s).filter(b => batchSel ? b === batchSel : !TEST_BATCHES.includes(b)).flatMap(b => R.batches[b] || []) : R.learners).map(e => e.toLowerCase());
    const replies = Object.values(latest).filter(r => r["Session ID"] === s.id);
    const emails = [...new Set([...expected, ...replies.map(r => String(r.Email).toLowerCase())])].filter(e => !R.admins.map(a => a.toLowerCase()).includes(e));
    const rowOf = e => { const r = latest[e + "|" + s.id]; return { e, r, a: r ? r.Answer : "" }; };
    const list = emails.map(rowOf).sort((x, y) => ({ no:0, "":1, yes:2 }[x.a] - { no:0, "":1, yes:2 }[y.a]) || x.e.localeCompare(y.e));
    const n = a => list.filter(x => x.a === a).length;
    return `<div class="sc"><h3>${esc(s.title)}</h3>
      <div class="meta">${esc(fmt(s))} · Room: ${s.room ? esc(s.room) : "None"} · Meeting link: ${s.link ? `<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.link.replace(/^https?:\/\//, ""))}</a>` : "None"}${s.batch ? ` · Batch ${esc(bl(s).join(", "))}` : ""}${s.desc ? `<br>${esc(s.desc)}` : ""}</div>
      <div class="counts"><span class="pill yes">Yes ${n("yes")}</span><span class="pill no">No ${n("no")}</span><span class="pill none">No reply ${n("")}</span></div>
      <div class="scroll"><table class="tbl"><thead><tr><th>Onboardee</th><th>Reply (in the hub)</th><th>When</th></tr></thead><tbody>
      ${list.map(({ e, r, a }) => `<tr><td><b>${esc(nameOf(e))}</b><div class="small muted">${esc(e)}</div></td><td>${a ? `<span class="pill ${a}">${a === "yes" ? "Yes" : "No"}</span>` : '<span class="pill none">No reply</span>'}</td><td class="small muted">${r ? esc(when(r.Timestamp)) : ""}</td></tr>`).join("") || '<tr><td colspan="3" class="muted">No onboardees on the list.</td></tr>'}
      </tbody></table></div></div>`;
  };
  const up = sessions.filter(s => new Date(s.d.getTime() + (s.minutes||60)*60000) >= now), past = sessions.filter(s => !up.includes(s));
  const bar = `<div class="bar" style="display:flex;gap:10px;align-items:center"><button class="btn sm" id="refresh">Refresh</button><label class="small muted">Batch <select id="bsel" style="font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:8px"><option value="">Pick a batch</option>${allBatches.map(b => `<option value="${esc(b)}" ${b === batchSel ? "selected" : ""}>${esc(b)}</option>`).join("")}</select></label></div>`;
  if (!batchSel) {   // pick a batch first: nothing else shows until then
    $("app").innerHTML = `<h1>Sessions</h1>${bar}<p class="muted" style="margin:-6px 0 4px">Pick a batch to see its attendance, sessions and replies.</p>
      <h2 class="sec">Login tracker</h2>${loginHelp}<div id="lt"></div>`;
    loginTracker($("lt"), "");
    $("refresh").onclick = load; $("bsel").onchange = e => { batchSel = e.target.value; render(rows); }; return;
  }
  $("app").innerHTML = `<h1>Sessions</h1>
    ${calErr ? '<p class="muted" style="margin:0 0 12px">The calendar couldn\'t be read (Code.gs needs redeploying, or calendar access isn\'t allowed yet).</p>' : ""}
    ${noReplies ? '<p class="muted" style="margin:0 0 12px">Replies couldn\'t be loaded (the Sheet didn\'t answer, or Code.gs needs redeploying), so everyone shows as "No reply yet".</p>' : ""}
    ${bar}
    <h2 class="sec">Attendance tracker</h2><p class="small muted" style="margin:-6px 0 12px">Only trainers see this. Click a box to mark Present, Absent or On leave and add a note. "All present" marks everyone without a mark yet; change anyone after.</p>
    <div id="att"></div>
    <h2 class="sec">Login tracker</h2>${loginHelp}<div id="lt"></div>
    <h2 class="sec">Upcoming</h2><p class="small muted" style="margin:-6px 0 12px">Synced from Google Calendar: salesops-calendar events with "Day N" or "Onboarding" in the title. Replies are what each guest answered in Calendar (updates within about 5 minutes).</p>
    ${up.map(card).join("") || '<p class="muted">No upcoming sessions.</p>'}
    <h2 class="sec">Past</h2><p class="small muted" style="margin:-6px 0 12px">Synced from Google Calendar (the last 3 weeks). Older sessions from before the sync show the Yes/No given in the hub.</p>
    ${past.map(card).join("") || '<p class="muted">No past sessions.</p>'}`;
  if (window.Attendance) {   // people of this batch: roster.js, the People tab, and calendar guests of this batch's sessions
    const adm = R.admins.map(a => a.toLowerCase());
    const pr = {}; PPL.forEach(p => pr[String(p.email).toLowerCase()] = p);   // People tab wins: Inactive, or moved to another batch = left out
    const ppl = [...(R.batches[batchSel] || []), ...PPL.filter(p => String(p.batch) === batchSel).map(p => p.email)].map(e => String(e).toLowerCase())
      .filter(e => !adm.includes(e) && (!pr[e] || (pr[e].active && (!pr[e].batch || String(pr[e].batch) === batchSel) && !(pr[e].access || []).some(a => /^admin$/i.test(a)))));
    Attendance.mount($("att"), { batch: batchSel, nameOf, people: ppl, sessions: sessions.filter(s => s.id).map(s => ({ id: s.id, title: s.title, when: s.when, cal: !!s.cal })) });
  }
  loginTracker($("lt"), batchSel);
  $("refresh").onclick = load;
  $("bsel").onchange = e => { batchSel = e.target.value; render(rows); };
}

/* Login tracker: sign-ins and first visit of the day (Logins tab), per person. No batch picked = everyone on the People tab (and anyone who signed in), admins left out. */
const loginHelp = '<p class="small muted" style="margin:-6px 0 12px">From the Sheet\'s Logins tab: each Google sign-in, and each person\'s first visit of the day. Least recently active first. Visits are counted from Nov 27, 2026.</p>';
function loginTracker(el, batch){
  if (!el) return;
  if (!LOGINS) { el.innerHTML = '<p class="muted">Couldn\'t load logins (Code.gs may need redeploying).</p>'; return; }
  const lc = v => String(v || "").toLowerCase(), R = LMS.roster(), adm = R.admins.map(lc), pr = {};
  PPL.forEach(p => pr[lc(p.email)] = p);
  const isAdm = e => adm.includes(e) || ((pr[e] || {}).access || []).some(a => /^admin$/i.test(a));
  const bOf = e => LMS.batchOf(e) || String((pr[e] || {}).batch || "");
  const st = {};
  LOGINS.forEach(([t, e, k, n]) => { if (!e) return; const s = st[e] = st[e] || { sign: 0, act: 0, n: 0, days: new Set(), name: "" }, ms = new Date(t).getTime() || 0;
    if (n) s.name = n;
    if (k === "signin") { s.n++; s.sign = Math.max(s.sign, ms); }
    s.act = Math.max(s.act, ms); s.days.add(new Date(ms).toLocaleDateString("en-CA", { timeZone: "Asia/Manila" })); });
  let ppl;
  if (batch) ppl = [...(R.batches[batch] || []), ...PPL.filter(p => String(p.batch) === batch).map(p => p.email)].map(lc).filter(e => !pr[e] || (pr[e].active && (!pr[e].batch || String(pr[e].batch) === batch)));
  else ppl = [...PPL.filter(p => p.active).map(p => lc(p.email)), ...Object.keys(st)].filter(e => !TEST_BATCHES.includes(bOf(e)) && !(pr[e] && !pr[e].active));
  ppl = [...new Set(ppl)].filter(e => e && !isAdm(e));
  const wk = Date.now() - 7 * 864e5, wkDays = e => [...((st[e] || {}).days || [])].filter(d => new Date(d + "T23:59:59+08:00").getTime() >= wk).length;
  const nm = e => (pr[e] && pr[e].name) || (st[e] && st[e].name) || nameOf(e);
  ppl.sort((a, b) => ((st[a] || {}).act || 0) - ((st[b] || {}).act || 0) || nm(a).localeCompare(nm(b)));
  const ago = ms => { if (!ms) return ""; const d = Math.floor((Date.now() - ms) / 864e5); return d <= 0 ? "today" : d === 1 ? "yesterday" : d + " days ago"; };
  const rows = ppl.map(e => { const s = st[e];
    return `<tr><td><b>${esc(nm(e))}</b><div class="small muted">${esc(e)}</div></td><td>${esc((pr[e] || {}).team || "—")}</td><td>${esc(bOf(e) || "—")}</td>
      <td>${s && s.sign ? esc(when(new Date(s.sign).toISOString())) : '<span class="pill none">Never</span>'}</td>
      <td>${s && s.act ? `${esc(when(new Date(s.act).toISOString()))}<div class="small muted">${ago(s.act)}</div>` : '<span class="pill no">Never</span>'}</td>
      <td>${s ? wkDays(e) : 0}</td><td>${s ? s.days.size : 0}</td></tr>`; });
  const q = el.dataset.q || "";
  el.innerHTML = `<div style="margin:0 0 10px"><input id="ltq" type="search" placeholder="Search name or email" value="${esc(q)}" style="font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:240px"></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>Person</th><th>Team</th><th>Batch</th><th>Last Google sign-in</th><th>Last active</th><th title="Days with a visit in the last 7 days">Days active (7d)</th><th>Days active (all)</th></tr></thead><tbody id="ltb"></tbody></table></div><div id="ltp"></div>`;
  const draw = () => { const qq = $("ltq").value.trim().toLowerCase(); el.dataset.q = qq;
    const list = rows.filter((r, i) => !qq || (ppl[i] + " " + nm(ppl[i])).toLowerCase().includes(qq));
    const pg = Pager.page("logins" + batch, list, batch ? Math.max(10, ppl.length) : 10);
    $("ltb").innerHTML = pg.rows.join("") || '<tr><td colspan="7" class="muted">Nobody here.</td></tr>'; $("ltp").innerHTML = pg.bar; Pager.wire($("ltp"), draw); };
  $("ltq").oninput = draw; draw();
}

if (LMS.requireSignIn()) {
  renderSide("sessions");
  if (!LMS.isAdmin()) $("app").innerHTML = '<h1>Sessions</h1><p class="muted">This page is for trainers.</p>';
  else if (!LMS.config.backendUrl) $("app").innerHTML = '<h1>Sessions</h1><p class="muted">The Google Sheet isn\'t connected yet (backendUrl in shared/lms.js).</p>';
  else load();
}
</script>
</body>
</html>
